version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: threatgraph_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatgraph_x
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threatgraph_x"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - threatgraph_net

  neo4j:
    image: neo4j:5.18-community
    container_name: threatgraph_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-changeme}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - threatgraph_net

  redis:
    image: redis:7-alpine
    container_name: threatgraph_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - threatgraph_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: threatgraph_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - POSTGRES_DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-changeme_postgres}@postgres:5432/threatgraph_x
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-changeme_jwt}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - EVIDENCE_VAULT_DIR=/app/data/evidence_vault
    ports:
      - "8000:8000"
    volumes:
      - ./data/evidence_vault:/app/data/evidence_vault
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threatgraph_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: threatgraph_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - threatgraph_net

networks:
  threatgraph_net:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
