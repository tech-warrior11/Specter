id: DET-EXEC-004
name: Living-off-the-Land Binary (LOLBIN) Invocation
severity: high
event_type: process
condition:
  action: process_created
  process: ["certutil.exe", "bitsadmin.exe", "mshta.exe", "rundll32.exe", "regsvr32.exe", "curl", "wget"]
threshold:
  count: 1
  window_minutes: 5
group_by:
  - host
mitre:
  tactic: Defense Evasion
  technique_id: T1218
  technique_name: System Binary Proxy Execution
description: Detects the execution of trusted operating system utilities frequently abused to download payloads or execute unmonitored binaries.
