id: DET-MULTI-001
name: Authentication Failure Followed By Execution
severity: high
event_type: multi-stage
condition:
  sequence:
    - { event_type: "authentication", action: "login_failed" }
    - { event_type: "authentication", action: "login_success" }
    - { event_type: "process", action: "process_created" }
threshold:
  count: 3
  window_minutes: 15
group_by:
  - user
  - host
mitre:
  tactic: Execution
  technique_id: T1059
  technique_name: Initial Access & Execution Correlation
description: Correlates failed authentication attempts quickly followed by a successful login and command execution.
